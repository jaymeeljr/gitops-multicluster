# Applied by the platform team to every cluster before Argo CD runs.
# The namespace, its security level and its budget are not in the app's
# hands: the AppProject forbids the app from changing them.
apiVersion: v1
kind: Namespace
metadata:
  name: task-platform
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: task-platform-quota
  namespace: task-platform
spec:
  hard:
    pods: "20"
    limits.cpu: "4"
    limits.memory: 4Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: task-platform-defaults
  namespace: task-platform
spec:
  limits:
    - type: Container
      default: { cpu: 200m, memory: 128Mi }
      defaultRequest: { cpu: 50m, memory: 64Mi }
