# Prod: more replicas, a disruption budget, and a pinned release tag.
# Promoting a release = changing newTag here in a reviewed pull request.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - pdb.yaml
labels:
  - pairs:
      environment: prod
images:
  - name: task-api
    newTag: release-1
replicas:
  - name: api
    count: 3
  - name: frontend
    count: 2
