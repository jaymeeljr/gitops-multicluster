# One ServiceAccount per tier. None of the apps call the Kubernetes API, so
# no token is mounted: a compromised pod gets no cluster credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: task-platform
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: task-platform
automountServiceAccountToken: false
